# Build the site with YOCaml (plus Pygments, KaTeX and D2) and publish _site/ to GitHub Pages.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  D2_VERSION: v0.9.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"

      - name: Install OCaml dependencies
        run: opam install . --deps-only --yes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygments
        run: pip install pygments

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install KaTeX
        run: npm ci

      - name: Install D2
        run: |
          curl -fsSL -o d2.tar.gz \
            "https://github.com/d2lang/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz"
          tar -xzf d2.tar.gz
          sudo install "d2-${D2_VERSION}/bin/d2" /usr/local/bin/d2
          d2 --version

      - name: Build site
        run: opam exec -- dune exec bin/site.exe

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
