<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{%- if has_page_title -%}{{ page_title }} · {% endif -%}Akhil Tulluri</title>
    {%- for m in meta %}
    <meta name="{{ m.name }}" content="{{ m.content }}" />
    {%- endfor %}
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/pygments.css" />
    <!-- Light/dark: apply a saved choice before first paint (no flash). -->
    <script>
      try {
        var m = localStorage.getItem("mode");
        if (m === "light" || m === "dark") document.documentElement.dataset.theme = m;
      } catch (e) {}
    </script>
    <link rel="alternate" type="application/atom+xml" title="Akhil Tulluri" href="/atom.xml" />
    <script src="/js/site.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-name" href="/" aria-label="Akhil Tulluri, home">
        <span class="name-te" lang="te">అఖిల్ తుళ్ళూరి</span>
      </a>
      <nav>
        <a href="/writing/">writing</a>
        <a href="/contact/">contact</a>
        <button class="mode-toggle" type="button" hidden aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </header>
    <main>
      {%- autoescape false -%}{{ yocaml_body }}{%- endautoescape -%}
    </main>
    <footer class="site-footer">
      <span>© Akhil Tulluri</span>
      <span>·</span>
      <a href="/atom.xml">feed</a>
      <span>·</span>
      <span>built with <a href="https://github.com/xhtmlboi/yocaml">YOCaml</a></span>
    </footer>
  </body>
</html>
